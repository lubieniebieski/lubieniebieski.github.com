    <span><span aria-hidden="true">💬</span> <a href="{{ .RelPermalink }}"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "2006-01-02T15:04Z07:00" }}</time></a><span class="note-age"></span></span>
  </header>
  <div class="post-content">{{ .Content }}</div>
</article>
